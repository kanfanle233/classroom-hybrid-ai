[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-hybrid-ai"
version = "0.1.0"
description = "Local LocateAnything-first + stateless Qwen3.5 classroom video analysis"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate>=1.13.0",
  "bitsandbytes>=0.49.2",
  "httpx>=0.28.1",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "Pillow>=11",
  "PyYAML>=6.0",
  "torch>=2.7",
  "transformers>=5.9.0",
  "ultralytics>=8.4.54",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
performance = ["av>=17.1", "psutil>=7.2"]

[project.scripts]
classroom-hybrid = "classroom_hybrid_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
classroom_hybrid_ai = ["configs/*.yaml", "configs/*.json"]
